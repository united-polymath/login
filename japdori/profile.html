<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 — 잡도리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <a href="home.html" class="icon-btn" aria-label="뒤로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <span style="font-size:16px;font-weight:700;">마이페이지</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="settings-btn" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="profile-shell">

  <!-- Profile header -->
  <div class="profile-head">
    <div class="profile-avatar-wrap" id="avatar-wrap">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <div class="profile-cam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>
      </div>
    </div>
    <div>
      <div class="profile-name" id="profile-name">…</div>
      <div class="profile-email" id="profile-email">…</div>
    </div>
  </div>

  <input type="file" id="avatar-input" accept="image/*" hidden>

  <!-- DEPOSIT CARD -->
  <div class="section-title-row">잡머니</div>
  <div class="card deposit-card" style="margin-top:0;">
    <div class="deposit-top">
      <div>
        <div class="deposit-amount"><span id="dp-current">—</span><span class="unit">원</span></div>
        <div class="deposit-sub">시작 ₩30,000 · 일당 ₩2,143</div>
      </div>
      <div class="donut">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="38" stroke="#F4F5EE" stroke-width="10" fill="none"/>
          <circle id="donut-fill" cx="46" cy="46" r="38" stroke="#C5F23F" stroke-width="10" fill="none"
                  stroke-dasharray="239" stroke-dashoffset="34" stroke-linecap="round"/>
        </svg>
        <div class="donut-center">
          <div class="donut-percent" id="donut-pct">—</div>
          <div class="donut-label">유지</div>
        </div>
      </div>
    </div>

    <div class="deposit-summary">
      <div class="ds-item plus">
        <span class="v" id="dp-preserved">—</span>
        <span class="l">보존</span>
      </div>
      <div class="ds-item minus">
        <span class="v" id="dp-lost">—</span>
        <span class="l">손실</span>
      </div>
      <div class="ds-item">
        <span class="v" id="dp-pending">—</span>
        <span class="l">대기</span>
      </div>
    </div>

    <div class="ledger-title">환급 기준</div>
    <div class="refund-tiers" id="refund-tiers"></div>
  </div>

  <!-- TRACKER (full) -->
  <div class="section-title-row" id="tracker">2주 트래커</div>
  <div class="card" style="margin-top:0;">
    <div class="tracker-grid" id="profile-tracker"></div>
    <div class="tracker-legend">
      <span class="leg"><span class="leg-sw approved"></span>승인</span>
      <span class="leg"><span class="leg-sw pending"></span>검토중</span>
      <span class="leg"><span class="leg-sw failed"></span>실패</span>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="section-title-row">설정</div>
  <div class="list-section">
    <button class="list-row" id="open-notices">
      <span class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7v16L3 13v-2z"/></svg>
        공지사항
      </span>
      <span class="arrow">›</span>
    </button>
    <button class="list-row" id="edit-affirm">
      <span class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        2주 목표 수정
      </span>
      <span class="arrow">›</span>
    </button>
    <button class="list-row danger" id="reset-data">
      <span class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
        챌린지 데이터 초기화
      </span>
      <span class="arrow">›</span>
    </button>
  </div>

  <div class="spacer-lg"></div>
  <button class="btn block" id="logout-btn">로그아웃</button>

</main>

<!-- BOTTOM NAV (홈 / + / 기록) -->
<nav class="bottom-nav">
  <button class="bnav-item" aria-label="홈" onclick="location.href='home.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>홈</span>
  </button>
  <button class="bnav-center" aria-label="인증" onclick="location.href='home.html'">+</button>
  <button class="bnav-item" aria-label="기록" onclick="location.href='records.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>기록</span>
  </button>
</nav>

<!-- DAY DETAIL MODAL (shared structure) -->
<dialog id="day-modal">
  <div class="modal-head">
    <div>
      <div class="day-detail-eyebrow" id="dd-eyebrow">DAY · DATE</div>
      <div class="day-detail-date" id="dd-date">—</div>
    </div>
    <button class="modal-close" data-close>&times;</button>
  </div>
  <div class="modal-body">
    <div class="day-detail-head">
      <span class="status-pill" id="dd-status">—</span>
      <span class="text-muted" style="font-size:11px;font-family:'JetBrains Mono',monospace;" id="dd-amount">−₩2,143</span>
    </div>
    <div class="mission-line" id="dd-mission">미션</div>
    <div id="dd-photo-wrap"></div>
    <div class="meta-list" id="dd-meta"></div>
    <div id="dd-note-wrap"></div>
  </div>
  <div class="modal-foot" id="dd-foot"></div>
</dialog>

<!-- NOTICE MODAL -->
<dialog id="notice-modal">
  <div class="modal-head">
    <div class="modal-title">공지사항</div>
    <button class="modal-close" data-close>&times;</button>
  </div>
  <div class="modal-body" id="notice-body"></div>
  <div class="modal-foot"><button class="btn dark block" data-close>닫기</button></div>
</dialog>

<!-- AFFIRMATION INFO MODAL -->
<dialog id="affirm-info-modal">
  <div class="modal-head">
    <div class="modal-title">2주 목표</div>
    <button class="modal-close" data-close>&times;</button>
  </div>
  <div class="modal-body">
    <div style="background:#F4F5EE;border-radius:10px;padding:12px 14px;margin-bottom:14px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">현재 설정된 목표</div>
      <div id="affirm-current" style="font-family:'Gowun Batang',serif;font-size:15px;line-height:1.55;white-space:pre-wrap;">—</div>
    </div>
    <div style="background:#FFF8E1;border:1px solid #F3DA86;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#7A5A00;">
      ⚠️ <strong>목표는 챌린지 도중 직접 변경할 수 없어요.</strong><br>
      변경을 원하시면 <strong>관리자 승인 절차</strong>가 다시 필요합니다.<br>
      운영진에게 직접 변경 요청을 보내주세요.
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn dark block" data-close>닫기</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app.js"></script>
<script>
  (async function () {
    const me = await Auth.requireAuth('login.html');
    if (!me) return;

    document.getElementById('profile-name').textContent = me.name;
    document.getElementById('profile-email').textContent = me.email;

    let att = await getAttendance(me.id);
    let settings = await getUserSettings(me.id);

    // 사진 path → signedUrl 캐싱
    const photoUrlCache = {};
    async function ensurePhotoUrl(path) {
      if (!path) return null;
      if (photoUrlCache[path]) return photoUrlCache[path];
      const url = await getPhotoUrl(path);
      photoUrlCache[path] = url;
      return url;
    }

    const avatar = document.getElementById('profile-avatar');
    if (settings.avatar_data_url) {
      avatar.style.backgroundImage = `url(${settings.avatar_data_url})`;
      avatar.style.color = 'transparent';
    } else {
      avatar.textContent = (me.name || '?').slice(0, 1);
    }

    // avatar upload (base64로 user_settings에 저장)
    const fileInput = document.getElementById('avatar-input');
    document.getElementById('avatar-wrap').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = async (ev) => {
        const dataUrl = ev.target.result;
        await updateUserSettings(me.id, { avatar_data_url: dataUrl });
        settings.avatar_data_url = dataUrl;
        avatar.style.backgroundImage = `url(${dataUrl})`;
        avatar.style.color = 'transparent';
      };
      r.readAsDataURL(f);
    });

    // ============================================================
    //  Deposit
    // ============================================================
    function renderDeposit() {
      const d = computeDeposit(att);
      const pct = Math.round((d.current / d.total) * 1000) / 10;

      document.getElementById('dp-current').textContent = fmt.number(d.current);
      document.getElementById('dp-preserved').textContent = fmt.currency(d.preserved);
      document.getElementById('dp-lost').textContent = `−${fmt.currency(d.lost)}`;
      document.getElementById('dp-pending').textContent = fmt.currency(d.pending);

      const circ = 2 * Math.PI * 38;
      const fillEl = document.getElementById('donut-fill');
      fillEl.setAttribute('stroke-dasharray', circ);
      fillEl.setAttribute('stroke-dashoffset', String(circ * (1 - pct/100)));
      document.getElementById('donut-pct').textContent = `${pct}%`;

      // refund tiers (단순화: 100% / 미만)
      const partialAmount = Math.round(d.total * (pct / 100));
      const tiers = [
        {
          key: 'full',
          pctLabel: '100%',
          label: '전액 환불 + 특별선물',
          amount: d.total,
          gift: '특별선물',
          isCurrent: pct >= 100,
        },
        {
          key: 'partial',
          pctLabel: '미만',
          label: '이행률만큼 환급 + 소정의 선물',
          amount: partialAmount,
          gift: '소정의 선물',
          isCurrent: pct < 100,
        },
      ];
      const tierEl = document.getElementById('refund-tiers');
      tierEl.innerHTML = tiers.map(t => `
        <div class="refund-row ${t.isCurrent ? 'current' : ''}">
          <span class="refund-pct">${t.pctLabel}</span>
          <span class="refund-desc">${t.label}</span>
          <span class="refund-amount">
            ${t.amount > 0 ? fmt.currency(t.amount) : '—'}
            ${t.gift ? `<span class="refund-gift">${t.gift}</span>` : ''}
          </span>
        </div>`).join('');

    }

    function statusLabel(s) {
      return ({
        approved: '승인', pending_review: '검토중', failed: '실패',
        today: '오늘', locked: '잠금',
      })[s] || s;
    }

    function statusMark(s, isGift) {
      if (isGift) return '🎁';
      return ({ approved: '✓', pending_review: '⏳', failed: '✕', today: '', locked: '' })[s] || '';
    }

    // ============================================================
    //  Profile Tracker
    // ============================================================
    async function renderTracker() {
      const grid = document.getElementById('profile-tracker');
      const cells = await Promise.all(att.map(async (a, i) => {
        const isGift = i === att.length - 1;
        const cls = isGift ? 'gift' : a.status.replace('_', '-');
        const photoUrl = a.photo_url ? await ensurePhotoUrl(a.photo_url) : null;
        const hasPhoto = !isGift && !!photoUrl;
        const photoLayer = hasPhoto ? `<img class="t-photo" src="${photoUrl}" alt="${a.day_number}일차 인증">` : '';
        return `
          <button class="t-cell ${cls}${hasPhoto ? ' has-photo' : ''}" data-day="${a.day_number}" type="button">
            ${photoLayer}
            <span class="t-day-num">${a.day_number}일차</span>
            <span class="t-mark">${statusMark(a.status, isGift)}</span>
          </button>`;
      }));
      grid.innerHTML = cells.join('');
      grid.querySelectorAll('.t-cell').forEach(btn => {
        btn.addEventListener('click', () => openDayModal(parseInt(btn.dataset.day, 10)));
      });
    }

    // ============================================================
    //  Day Detail Modal
    // ============================================================
    const dayModal = document.getElementById('day-modal');

    async function openDayModal(dayNum) {
      const a = att.find(x => x.day_number === dayNum);
      if (!a) return;
      const isGift = dayNum === att.length;
      document.getElementById('dd-eyebrow').textContent = `${a.day_number}일차 · ${fmt.dow(a.date)}요일`;
      document.getElementById('dd-date').textContent = fmt.date(a.date);

      const statusEl = document.getElementById('dd-status');
      statusEl.className = `status-pill ${a.status.replace('_','-')}`;
      statusEl.textContent = isGift ? '🎁 보너스' : statusLabel(a.status);

      const PER_DAY = Math.round(SEED.DEPOSIT_AMOUNT / SEED.CHALLENGE_DAYS);
      const amountEl = document.getElementById('dd-amount');
      if (a.status === 'approved')      amountEl.innerHTML = `<span style="color:var(--accent-deep)">+ ${fmt.currency(PER_DAY)} 보존</span>`;
      else if (a.status === 'failed')   amountEl.innerHTML = `<span style="color:var(--danger)">− ${fmt.currency(PER_DAY)} 손실</span>`;
      else                              amountEl.textContent = `보증금 ${fmt.currency(PER_DAY)} 걸려있음`;

      document.getElementById('dd-mission').textContent = a.mission;

      const photoWrap = document.getElementById('dd-photo-wrap');
      const photoUrl = a.photo_url ? await ensurePhotoUrl(a.photo_url) : null;
      if (photoUrl) {
        photoWrap.innerHTML = `<div class="photo-frame"><img src="${photoUrl}" alt="인증사진"></div>`;
      } else if (a.status === 'locked') {
        photoWrap.innerHTML = `<div class="photo-frame empty">아직 잠긴 미션<br><span style="font-size:11px;">${fmt.date(a.date)}에 열려요</span></div>`;
      } else if (a.status === 'today') {
        photoWrap.innerHTML = `<div class="photo-frame empty">오늘 인증을 기다리고 있어요</div>`;
      } else if (a.status === 'failed') {
        photoWrap.innerHTML = `<div class="photo-frame empty">사진 미제출 · 차감 처리됨</div>`;
      } else {
        photoWrap.innerHTML = `<div class="photo-frame empty">사진 없음</div>`;
      }

      const rows = [];
      if (a.submitted_at) rows.push(`<div class="meta-row"><span class="l">제출</span><span class="v">${fmt.dateTime(a.submitted_at)}</span></div>`);
      if (a.reviewed_at)  rows.push(`<div class="meta-row"><span class="l">검토</span><span class="v">${fmt.dateTime(a.reviewed_at)}</span></div>`);
      document.getElementById('dd-meta').innerHTML = rows.join('');
      document.getElementById('dd-note-wrap').innerHTML = a.review_note ? `<div class="review-note">${a.review_note}</div>` : '';

      const foot = document.getElementById('dd-foot');
      foot.innerHTML = `<button class="btn dark block" data-close>닫기</button>`;
      foot.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dayModal.close()));

      dayModal.showModal();
    }

    // ============================================================
    //  Settings actions
    // ============================================================
    document.getElementById('settings-btn').addEventListener('click', () =>
      document.getElementById('open-notices').scrollIntoView({ behavior: 'smooth', block: 'start' })
    );

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await Auth.logout();
      location.replace('login.html');
    });

    document.getElementById('edit-affirm').addEventListener('click', () => {
      const current = settings.affirmation && settings.affirmation.trim();
      if (!current) {
        // 아직 첫 설정 전 — 홈에서 강제 입력 받도록 유도
        alert('목표는 홈 화면 첫 진입 시 설정할 수 있어요.\n홈으로 이동합니다.');
        location.href = 'home.html';
        return;
      }
      document.getElementById('affirm-current').textContent = current;
      document.getElementById('affirm-info-modal').showModal();
    });

    document.getElementById('reset-data').addEventListener('click', async () => {
      if (!confirm('목표/아바타를 초기화할까요? (출석 기록은 유지됩니다)')) return;
      await updateUserSettings(me.id, { affirmation: '', avatar_data_url: null });
      location.reload();
    });

    // notices modal
    document.getElementById('open-notices').addEventListener('click', async () => {
      const notices = await listNotices();
      const body = document.getElementById('notice-body');
      body.innerHTML = notices.length ? notices.map(n => `
        <div style="padding:12px 4px;border-bottom:1px solid var(--line-soft);">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            ${n.pinned ? '<span class="notice-pin"></span>' : ''}
            <strong style="font-size:14px;">${n.title}</strong>
          </div>
          <p style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">${n.body}</p>
          <span style="font-size:11px;color:var(--muted);">${fmt.date(n.created_at)}</span>
        </div>
      `).join('') : '<div class="empty">새 공지사항이 없습니다</div>';
      document.getElementById('notice-modal').showModal();
    });

    document.querySelectorAll('dialog [data-close]').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('dialog').close());
    });

    // ----- render
    renderDeposit();
    await renderTracker();

    if (location.hash === '#tracker') {
      setTimeout(() => document.getElementById('tracker').scrollIntoView({ behavior: 'smooth' }), 80);
    }
  })();
</script>
</body>
</html>
