<style>

</style>

<script>
// ============================================================
//  Supabase 초기화
// ============================================================
const { createClient } = supabase;
const db = createClient(
  'https://hroyuxjqqlimwrrhdwnd.supabase.co',
  'sb_publishable_RihZu0hAorZDdbE7bddoPQ_qsFpc0C4'
);

// ============================================================
//  전역 상태
// ============================================================
let currentUser = null;
let currentProfile = null;
let currentChannel = 'public';
let selectedTag = null;
let myLikedPostIds = new Set();
let isSubmitting = false;
let realtimeChannel = null;

// ============================================================
//  초기화
// ============================================================
async function init() {
  try {
    const { data: { session }, error } = await db.auth.getSession();
    if (error) throw error;

    if (session) {
      currentUser = session.user;
      await loadProfile();
      updateHeaderAvatar();
      updateWriteBar();
    } else {
      updateWriteBar();
    }

    await loadFeed();
    setupRealtime();

  } catch (err) {
    console.error('초기화 오류:', err);
    showToast('페이지를 불러오는 중 오류가 발생했습니다', 'error');
    updateWriteBar();
    await loadFeed();
  }
}

// ============================================================
//  프로필 로드
// ============================================================
async function loadProfile() {
  if (!currentUser) return;
  try {
    const { data, error } = await db
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();
    if (error && error.code !== 'PGRST116') throw error;
    currentProfile = data;
  } catch (err) {
    console.error('프로필 로드 오류:', err);
  }
}

// ============================================================
//  헤더 아바타 업데이트
// ============================================================
function updateHeaderAvatar() {
  const el = document.getElementById('header-avatar');
  if (!el) return;
  if (currentProfile && currentProfile.name) {
    const initial = currentProfile.name.charAt(0).toUpperCase();
    el.innerHTML = `<span class="text-sm font-bold text-blue-700">${initial}</span>`;
    el.classList.remove('bg-slate-200');
    el.classList.add('bg-blue-100');
  }
}

// ============================================================
//  글쓰기 바 업데이트
// ============================================================
function updateWriteBar() {
  const loginBanner = document.getElementById('login-banner');
  const writeBarAvatar = document.getElementById('write-bar-avatar');

  if (currentUser && currentProfile) {
    loginBanner.classList.add('hidden');
    const initial = currentProfile.name ? currentProfile.name.charAt(0).toUpperCase() : '?';
    writeBarAvatar.innerHTML = `<span class="text-white font-bold text-sm">${initial}</span>`;
    writeBarAvatar.className = 'w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0';
  } else if (currentUser) {
    loginBanner.classList.add('hidden');
  } else {
    loginBanner.classList.remove('hidden');
  }
}

// ============================================================
//  채널 전환
// ============================================================
function switchChannel(channel) {
  // 권한 확인
  if (channel === 'manager') {
    if (!currentUser) {
      showToast('로그인이 필요합니다', 'warning');
      return;
    }
    const role = currentProfile?.role;
    if (role !== 'manager' && role !== 'admin') {
      showToast('매니저 이상 권한이 필요합니다', 'warning');
      return;
    }
  }
  if (channel === 'admin') {
    if (!currentUser) {
      showToast('로그인이 필요합니다', 'warning');
      return;
    }
    if (currentProfile?.role !== 'admin') {
      showToast('매니저 이상 권한이 필요합니다', 'warning');
      return;
    }
  }

  currentChannel = channel;

  // 탭 UI 업데이트
  document.querySelectorAll('.channel-btn').forEach(btn => {
    if (btn.dataset.channel === channel) {
      btn.classList.add('active');
      btn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
    } else {
      btn.classList.remove('active');
      btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
    }
  });

  loadFeed();
}

// ============================================================
//  피드 로드
// ============================================================
async function loadFeed() {
  const feedEl = document.getElementById('feed');
  const loadingEl = document.getElementById('feed-loading');
  const emptyEl = document.getElementById('feed-empty');
  const errorEl = document.getElementById('feed-error');

  // 상태 초기화
  feedEl.innerHTML = '';
  feedEl.classList.add('hidden');
  loadingEl.classList.remove('hidden');
  emptyEl.classList.add('hidden');
  errorEl.classList.add('hidden');

  try {
    // 포스트 조회 (프로필 join)
    const { data: posts, error: postsError } = await db
      .from('posts')
      .select('*, profiles(name, role)')
      .eq('channel', currentChannel)
      .order('created_at', { ascending: false });

    if (postsError) throw postsError;

    // 내가 좋아요한 포스트 확인
    myLikedPostIds = new Set();
    if (currentUser) {
      const { data: myLikes, error: likesError } = await db
        .from('likes')
        .select('post_id')
        .eq('user_id', currentUser.id);

      if (!likesError && myLikes) {
        myLikes.forEach(l => myLikedPostIds.add(l.post_id));
      }
    }

    loadingEl.classList.add('hidden');
    feedEl.classList.remove('hidden');

    if (!posts || posts.length === 0) {
      emptyEl.classList.remove('hidden');
      return;
    }

    posts.forEach(post => {
      feedEl.appendChild(renderPostCard(post));
    });

  } catch (err) {
    console.error('피드 로드 오류:', err);
    loadingEl.classList.add('hidden');
    errorEl.classList.remove('hidden');
    showToast('피드를 불러오지 못했습니다', 'error');
  }
}

// ============================================================
//  포스트 카드 렌더링
// ============================================================
function renderPostCard(post) {
  const profile = post.profiles || {};
  const name = profile.name || '알 수 없는 사용자';
  const role = profile.role || 'member';
  const initial = name.charAt(0).toUpperCase();
  const isLiked = myLikedPostIds.has(post.id);
  const timeAgo = formatTimeAgo(post.created_at);
  const contentHtml = escapeHtml(post.content).replace(/\n/g, '<br>');

  // 역할 뱃지
  let badgeHtml = '';
  if (role === 'manager') {
    badgeHtml = `<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full text-[10px] font-bold">[매니저]</span>`;
  } else if (role === 'admin') {
    badgeHtml = `<span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full text-[10px] font-bold">[관리자]</span>`;
  }

  // 태그 색상
  const tagColors = {
    '#마음성장': 'bg-emerald-100 text-emerald-700',
    '#커리어': 'bg-blue-100 text-blue-700',
    '#독서기록': 'bg-violet-100 text-violet-700',
    '#인간관계': 'bg-rose-100 text-rose-700',
    '#일상': 'bg-amber-100 text-amber-700',
  };
  const tagColor = tagColors[post.tag] || 'bg-slate-100 text-slate-600';
  const tagHtml = post.tag ? `<span class="px-2 py-0.5 ${tagColor} rounded-full text-[10px] font-bold">${escapeHtml(post.tag)}</span>` : '';

  // 아바타 배경색 (이름 기반)
  const avatarColors = ['bg-blue-500', 'bg-violet-500', 'bg-emerald-500', 'bg-rose-500', 'bg-amber-500', 'bg-indigo-500', 'bg-teal-500'];
  const colorIdx = name.charCodeAt(0) % avatarColors.length;
  const avatarBg = avatarColors[colorIdx];

  const card = document.createElement('article');
  card.className = 'post-card bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden';
  card.dataset.postId = post.id;

  card.innerHTML = `
    <div class="p-5">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full ${avatarBg} flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
          ${initial}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="font-semibold text-[15px] text-on-surface">${escapeHtml(name)}</span>
            ${badgeHtml}
            <span class="text-[12px] text-slate-400">· ${timeAgo}</span>
          </div>
          ${tagHtml ? `<div class="mt-1">${tagHtml}</div>` : ''}
        </div>
      </div>
      <div class="mt-3 text-on-surface-variant text-[15px] leading-relaxed">
        ${contentHtml}
      </div>
    </div>
    <div class="px-4 py-3 flex items-center gap-5 border-t border-slate-50">
      <button
        onclick="toggleLike('${post.id}', this)"
        class="like-btn flex items-center gap-1.5 transition-colors ${isLiked ? 'like-btn-active text-rose-500' : 'text-slate-400 hover:text-rose-400'}"
        data-liked="${isLiked ? 'true' : 'false'}"
        data-count="${post.likes_count || 0}"
      >
        <span class="material-symbols-outlined like-icon text-[20px]" style="font-variation-settings:'FILL' ${isLiked ? '1' : '0'}, 'wght' 400, 'GRAD' 0, 'opsz' 24">favorite</span>
        <span class="like-count text-[13px] font-medium">${post.likes_count || 0}</span>
      </button>
      <div class="flex items-center gap-1.5 text-slate-300">
        <span class="material-symbols-outlined text-[20px]">chat_bubble</span>
        <span class="text-[13px] font-medium">0</span>
      </div>
    </div>
  `;

  return card;
}

// ============================================================
//  좋아요 토글
// ============================================================
async function toggleLike(postId, btnEl) {
  if (!currentUser) {
    showToast('로그인이 필요합니다', 'warning');
    return;
  }

  const isLiked = btnEl.dataset.liked === 'true';
  const countEl = btnEl.querySelector('.like-count');
  const iconEl = btnEl.querySelector('.like-icon');
  let count = parseInt(btnEl.dataset.count) || 0;

  // 낙관적 UI 업데이트
  if (isLiked) {
    count = Math.max(0, count - 1);
    btnEl.dataset.liked = 'false';
    btnEl.dataset.count = count;
    btnEl.classList.remove('like-btn-active', 'text-rose-500');
    btnEl.classList.add('text-slate-400', 'hover:text-rose-400');
    iconEl.style.fontVariationSettings = "'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24";
    countEl.textContent = count;
    myLikedPostIds.delete(postId);
  } else {
    count = count + 1;
    btnEl.dataset.liked = 'true';
    btnEl.dataset.count = count;
    btnEl.classList.add('like-btn-active', 'text-rose-500');
    btnEl.classList.remove('text-slate-400', 'hover:text-rose-400');
    iconEl.style.fontVariationSettings = "'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24";
    countEl.textContent = count;
    myLikedPostIds.add(postId);
  }

  try {
    if (isLiked) {
      const { error } = await db.from('likes').delete().match({ post_id: postId, user_id: currentUser.id });
      if (error) throw error;
    } else {
      const { error } = await db.from('likes').insert({ post_id: postId, user_id: currentUser.id });
      if (error) throw error;
    }
  } catch (err) {
    console.error('좋아요 오류:', err);
    // 롤백
    if (isLiked) {
      count = count + 1;
      btnEl.dataset.liked = 'true';
      btnEl.dataset.count = count;
      btnEl.classList.add('like-btn-active', 'text-rose-500');
      btnEl.classList.remove('text-slate-400', 'hover:text-rose-400');
      iconEl.style.fontVariationSettings = "'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24";
      countEl.textContent = count;
      myLikedPostIds.add(postId);
    } else {
      count = Math.max(0, count - 1);
      btnEl.dataset.liked = 'false';
      btnEl.dataset.count = count;
      btnEl.classList.remove('like-btn-active', 'text-rose-500');
      btnEl.classList.add('text-slate-400', 'hover:text-rose-400');
      iconEl.style.fontVariationSettings = "'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24";
      countEl.textContent = count;
      myLikedPostIds.delete(postId);
    }
    showToast('좋아요 처리 중 오류가 발생했습니다', 'error');
  }
}

// ============================================================
//  글쓰기 모달
// ============================================================
function openWriteModal() {
  if (!currentUser) {
    showToast('로그인이 필요합니다. 마이페이지에서 로그인해주세요.', 'warning');
    setTimeout(() => { location.href = '마이페이지.html'; }, 1500);
    return;
  }

  // 모달 설정
  const name = currentProfile?.name || '사용자';
  const initial = name.charAt(0).toUpperCase();
  document.getElementById('modal-avatar').textContent = initial;
  document.getElementById('modal-username').textContent = name;

  const channelLabels = { public: '전체 피드', manager: '매니저 라운지', admin: '관리자 채널' };
  document.getElementById('modal-channel-label').textContent = channelLabels[currentChannel] || '전체 피드';

  // 초기화
  document.getElementById('write-content').value = '';
  document.getElementById('char-count').textContent = '0 / 500';
  selectedTag = null;
  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.classList.remove('selected', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
    btn.classList.add('bg-slate-100', 'text-slate-600', 'border-transparent');
  });

  const overlay = document.getElementById('write-overlay');
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  setTimeout(() => {
    document.getElementById('write-content').focus();
  }, 100);
}

function closeWriteModal() {
  document.getElementById('write-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

function selectTag(btn, tag) {
  selectedTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('selected', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
    b.classList.add('bg-slate-100', 'text-slate-600', 'border-transparent');
  });
  btn.classList.add('selected', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
  btn.classList.remove('bg-slate-100', 'text-slate-600', 'border-transparent');
}

function updateCharCount() {
  const content = document.getElementById('write-content').value;
  const count = content.length;
  const countEl = document.getElementById('char-count');
  countEl.textContent = `${count} / 500`;
  if (count > 450) {
    countEl.classList.add('text-amber-500');
    countEl.classList.remove('text-slate-400');
  } else {
    countEl.classList.remove('text-amber-500');
    countEl.classList.add('text-slate-400');
  }
}

// ============================================================
//  글 제출
// ============================================================
async function submitPost() {
  if (isSubmitting) return;
  if (!currentUser) {
    showToast('로그인이 필요합니다', 'warning');
    return;
  }

  const content = document.getElementById('write-content').value.trim();
  if (!content) {
    showToast('내용을 입력해주세요', 'warning');
    document.getElementById('write-content').focus();
    return;
  }
  if (content.length > 500) {
    showToast('500자 이내로 작성해주세요', 'warning');
    return;
  }

  isSubmitting = true;
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = '게시 중...';

  try {
    const { error } = await db.from('posts').insert({
      user_id: currentUser.id,
      content: content,
      tag: selectedTag,
      channel: currentChannel,
    });

    if (error) throw error;

    closeWriteModal();
    showToast('글이 게시되었습니다!', 'success');
    await loadFeed();

  } catch (err) {
    console.error('글 게시 오류:', err);
    let msg = '글을 게시하지 못했습니다';
    if (err.message) {
      if (err.message.includes('permission') || err.message.includes('policy')) {
        msg = '이 채널에 글을 쓸 권한이 없습니다';
      } else if (err.message.includes('network') || err.message.includes('fetch')) {
        msg = '네트워크 오류가 발생했습니다. 다시 시도해주세요';
      }
    }
    showToast(msg, 'error');
  } finally {
    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '게시하기';
  }
}

// ============================================================
//  실시간 업데이트
// ============================================================
function setupRealtime() {
  if (realtimeChannel) {
    db.removeChannel(realtimeChannel);
  }

  realtimeChannel = db.channel('community-posts')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'posts',
    }, async (payload) => {
      const newPost = payload.new;
      if (newPost.channel !== currentChannel) return;

      try {
        const { data: postWithProfile } = await db
          .from('posts')
          .select('*, profiles(name, role)')
          .eq('id', newPost.id)
          .single();

        if (postWithProfile) {
          const feedEl = document.getElementById('feed');
          const emptyEl = document.getElementById('feed-empty');

          emptyEl.classList.add('hidden');
          feedEl.classList.remove('hidden');

          // 이미 있는 카드면 무시 (자기 자신이 게시한 경우 이미 loadFeed로 추가됨)
          if (!document.querySelector(`[data-post-id="${newPost.id}"]`)) {
            const card = renderPostCard(postWithProfile);
            feedEl.insertBefore(card, feedEl.firstChild);

            // 상단에 새 글 토스트
            if (currentUser && newPost.user_id !== currentUser.id) {
              showToast('새 글이 게시되었습니다', 'info');
            }
          }
        }
      } catch (err) {
        console.error('실시간 업데이트 오류:', err);
      }
    })
    .subscribe();
}

// ============================================================
//  유틸리티 함수
// ============================================================
function formatTimeAgo(dateStr) {
  if (!dateStr) return '';
  const now = new Date();
  const date = new Date(dateStr);
  const diff = Math.floor((now - date) / 1000);

  if (diff < 60) return '방금 전';
  if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}.${m}.${d}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

let toastTimer = null;
function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  const inner = document.getElementById('toast-inner');

  const colors = {
    success: 'bg-emerald-600',
    error: 'bg-red-600',
    warning: 'bg-amber-500',
    info: 'bg-slate-700',
  };

  inner.className = `px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white max-w-[320px] text-center ${colors[type] || colors.info}`;
  inner.textContent = message;

  toast.classList.remove('hiding', 'hidden');
  toast.style.animation = 'none';
  requestAnimationFrame(() => {
    toast.style.animation = '';
    toast.id = 'toast'; // re-trigger
  });

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.add('hiding');
    setTimeout(() => {
      toast.classList.add('hidden');
      toast.classList.remove('hiding');
    }, 250);
  }, 3000);
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeWriteModal();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    if (!document.getElementById('write-overlay').classList.contains('hidden')) {
      submitPost();
    }
  }
});

//  페이지 로드
// ============================================================
document.addEventListener('DOMContentLoaded', init);
</script>
