<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LOGIN - 커뮤니티</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "on-surface": "#191c1e",
          "on-surface-variant": "#434655",
          "background": "#f7f9fb",
        }
      }
    }
  }
</script>
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { min-height: 100dvh; background: #f7f9fb; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  textarea:focus { outline: none; box-shadow: none; }

  /* Channel tab */
  .channel-btn.active { background: #0E0E0E; color: #C8E600; font-weight: 700; border-color: #0E0E0E; }
  .channel-btn { transition: all 0.15s; color: #555; border: 1.5px solid #D8D5CA; background: #FFFFFF; }
  .channel-btn:hover { border-color: #0E0E0E; }

  /* Category filter */
  .cat-btn.active { background: #0E0E0E; color: #C8E600; border-color: #0E0E0E; }
  .cat-btn { transition: all 0.15s; color: #555; border: 1.5px solid #D8D5CA; background: #FFFFFF; }
  .cat-btn:hover { border-color: #0E0E0E; }

  /* Post card */
  .post-card { transition: border-color 0.15s, box-shadow 0.15s; }
  .post-card:hover { border-color: #0E0E0E; box-shadow: 4px 4px 0 rgba(14,14,14,0.08); }

  /* Comments panel */
  .comment-panel { display: none; }
  .comment-panel.open { display: block; animation: fadeSlide 0.2s ease forwards; }

  /* Animations */
  @keyframes fadeSlide { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes cardIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .post-card { animation: cardIn 0.2s ease forwards; }

  /* Skeleton */
  .skeleton { background: linear-gradient(90deg,#F4F1E8 25%,#EDE9DF 50%,#F4F1E8 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Write modal */
  .modal-enter { animation: modalUp 0.25s ease-out forwards; }
  @keyframes modalUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  #write-overlay { backdrop-filter: blur(6px); }
  #write-modal {
    background: #FFFFFF;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  .tag-btn.selected { background: #0E0E0E; color: #C8E600; border-color: #0E0E0E; }
  .tag-btn { color: #555; border: 1.5px solid #D8D5CA; background: #FFFFFF; }
  .tag-btn:hover { border-color: #0E0E0E; }

  /* Like active */
  .like-btn-active .like-icon { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }

  /* Write bar pulse */
  @keyframes writePulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
  #write-bar-hint { animation: writePulse 3s ease-in-out infinite; }

  /* Toast */
  @keyframes toastIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  #toast { animation: toastIn 0.25s ease forwards; }

  /* ════════════════════════════════════════
   LOGIN EDITORIAL DESIGN
   ════════════════════════════════════════ */
  :root {
    --lime: #C8E600;
    --lime-dim: #A8C400;
    --lime-bg: #EEF7B5;
    --bg:      #FAFAF5;
    --surface: #F4F1E8;
    --card:    #FFFFFF;
    --raised:  #EDE9DF;
    --border:  #E5E2D7;
    --border2: #D8D5CA;
    --text1:   #0E0E0E;
    --text2:   #555555;
    --text3:   #8A8A8A;
  }

  html, body {
    background-color: var(--bg) !important;
    background-image: linear-gradient(rgba(14,14,14,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(14,14,14,0.03) 1px, transparent 1px) !important;
    background-size: 24px 24px !important;
    background-attachment: fixed !important;
    color: var(--text1) !important;
    font-family: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif !important;
  }

  header {
    background-color: rgba(14,14,14,0.97) !important;
    border-bottom-color: #2A2A2A !important;
    box-shadow: 0 1px 12px rgba(0,0,0,0.5) !important;
  }
  header a.text-slate-600, header a.text-slate-600:hover { color: #8A8A8A !important; }
  header a.text-slate-600:hover { color: #FFFFFF !important; }
  header img { border-radius: 4px !important; }

  nav.fixed.bottom-0 {
    background-color: rgba(14,14,14,0.98) !important;
    border-top-color: #2A2A2A !important;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.5) !important;
  }
  nav.fixed.bottom-0 a { color: #666 !important; }

  .bg-white                         { background-color: var(--card) !important; }
  .bg-slate-50                      { background-color: var(--surface) !important; }
  .bg-slate-100                     { background-color: var(--raised) !important; }
  .bg-slate-200                     { background-color: #E5E2D7 !important; }
  .bg-slate-300                     { background-color: #D8D5CA !important; }
  .bg-gray-50                       { background-color: var(--surface) !important; }
  .bg-gray-100                      { background-color: var(--raised) !important; }
  .bg-background                    { background-color: var(--bg) !important; }
  .bg-surface, .bg-surface-bright,
  .bg-surface-container-lowest      { background-color: var(--surface) !important; }
  .bg-surface-container-low         { background-color: var(--card) !important; }
  .bg-surface-container             { background-color: var(--raised) !important; }
  .bg-surface-container-high        { background-color: #E5E2D7 !important; }
  .bg-surface-container-highest     { background-color: #D8D5CA !important; }

  .border-slate-100, .border-outline-variant { border-color: var(--border) !important; }
  .border-slate-200 { border-color: var(--border2) !important; }
  .border-slate-300 { border-color: #CCC9BE !important; }
  .divide-slate-100 > * + * { border-color: var(--border) !important; }

  .text-slate-300                 { color: #B8B4A8 !important; }
  .text-slate-400                 { color: var(--text3) !important; }
  .text-slate-500                 { color: #777 !important; }
  .text-slate-600, .text-outline  { color: var(--text2) !important; }
  .text-slate-700                 { color: #333 !important; }
  .text-slate-800                 { color: #1A1A1A !important; }
  .text-slate-900                 { color: var(--text1) !important; }
  .text-on-surface                { color: var(--text1) !important; }
  .text-on-surface-variant        { color: var(--text2) !important; }
  .text-on-background             { color: var(--text1) !important; }

  .text-blue-600, .text-blue-700, .text-primary { color: #6B8700 !important; }
  .bg-blue-600, .bg-primary,
  .bg-primary-container           { background-color: #0E0E0E !important; color: var(--lime) !important; }
  .border-blue-600, .border-primary { border-color: #0E0E0E !important; }
  .bg-blue-50, .bg-blue-100       { background-color: var(--lime-bg) !important; }
  .text-blue-200                  { color: #8A8A8A !important; }
  .hover\:bg-blue-700:hover,
  .hover\:bg-blue-600:hover      { background-color: #2A2A2A !important; }
  .text-on-primary                { color: #0E0E0E !important; }
  .bg-primary-fixed               { background-color: var(--lime-bg) !important; }
  .text-on-primary-container      { color: #6B8700 !important; }

  .hover\:shadow-md:hover { box-shadow: 4px 4px 0 rgba(14,14,14,0.12) !important; }
  .hover\:shadow-lg:hover { box-shadow: 6px 6px 0 rgba(14,14,14,0.12) !important; }
  .shadow-sm { box-shadow: 0 2px 8px rgba(14,14,14,0.08) !important; }
  .shadow-md { box-shadow: 0 6px 20px rgba(14,14,14,0.10) !important; }

  .hover\:bg-slate-50:hover  { background-color: var(--surface) !important; }
  .hover\:bg-slate-100:hover { background-color: var(--raised) !important; }
  .hover\:bg-slate-200:hover { background-color: #E5E2D7 !important; }

  input, textarea, select {
    background-color: #FFFFFF !important;
    border-color: var(--border2) !important;
    color: var(--text1) !important;
  }
  input::placeholder, textarea::placeholder { color: var(--text3) !important; }
  input:focus, textarea:focus, select:focus {
    border-color: #0E0E0E !important;
    box-shadow: 0 0 0 3px var(--lime-bg) !important;
  }

  section.bg-white, div.bg-white { background-color: var(--card) !important; }

  nav a.text-blue-600 span { color: var(--lime) !important; }
  nav a.text-blue-600      { color: var(--lime) !important; }

  .rounded-2xl { border-radius: 4px !important; }
  .rounded-xl  { border-radius: 4px !important; }
  .rounded-lg  { border-radius: 4px !important; }

  .bg-slate-800, .bg-slate-900 { background-color: #0E0E0E !important; color: #FFFFFF !important; }

</style>
</head>
<body class="bg-background text-on-surface pb-28">

<!-- Toast -->
<div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[100] hidden">
  <div id="toast-inner" class="px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white max-w-[320px] text-center"></div>
</div>

<!-- Header -->
<nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
  <div class="flex justify-between items-center h-16 px-5 w-full max-w-[1200px] mx-auto">
    <a href="index.html"><img src="logo2.jpg" alt="LOGIN" class="h-11 w-auto rounded-lg"/></a>
    <div class="hidden md:flex gap-8 items-center">
      <a class="text-slate-600 font-medium hover:opacity-80" href="index.html">홈</a>
      <a class="text-slate-600 font-medium hover:opacity-80" href="about.html">About Us</a>
      <a class="text-slate-600 font-medium hover:opacity-80" href="프로그램.html">프로그램</a>
      <a class="text-slate-600 font-medium hover:opacity-80" href="인사이트.html">인사이트</a>
      <a class="text-blue-600 font-semibold" href="커뮤니티.html">커뮤니티</a>
      <a class="text-slate-600 font-medium hover:opacity-80" href="마이페이지.html">마이페이지</a>
    </div>
    <div id="header-avatar" class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center cursor-pointer hover:opacity-80 border-2 border-white shadow-sm" onclick="location.href='마이페이지.html'">
      <span class="material-symbols-outlined text-slate-400 text-[18px]">person</span>
    </div>
  </div>
</nav>

<!-- Write Modal -->
<div id="write-overlay" class="fixed inset-0 z-50 bg-black/40 hidden" onclick="closeWriteModal()">
  <div id="write-modal" class="fixed left-0 right-0 rounded-t-3xl max-w-2xl mx-auto modal-enter border border-[#D8D5CA] border-b-0" style="bottom:80px" onclick="event.stopPropagation()">
    <div class="w-10 h-1 bg-[#333] rounded-full mx-auto mt-4 mb-0 flex-shrink-0"></div>
    <div class="flex items-center justify-between px-6 pt-4 pb-3 border-b border-[#E5E2D7] flex-shrink-0">
      <div class="flex items-center gap-3">
        <div id="modal-avatar" class="w-9 h-9 rounded-full bg-[#C8E600] flex items-center justify-center text-black font-bold text-sm flex-shrink-0"></div>
        <div>
          <div id="modal-username" class="font-semibold text-[#0E0E0E] text-sm"></div>
          <div id="modal-channel-label" class="text-xs text-[#666] mt-0.5"></div>
        </div>
      </div>
      <button onclick="closeWriteModal()" class="text-[#555] hover:text-[#0E0E0E] p-1 -mr-1 transition-colors">
        <span class="material-symbols-outlined text-[22px]">close</span>
      </button>
    </div>
    <div class="flex gap-2 px-6 pt-3 pb-2 overflow-x-auto hide-scrollbar flex-shrink-0">
      <button onclick="selectTag(this,'#마음성장')" class="tag-btn px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#888] text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#마음성장</button>
      <button onclick="selectTag(this,'#커리어')" class="tag-btn px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#888] text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#커리어</button>
      <button onclick="selectTag(this,'#독서기록')" class="tag-btn px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#888] text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#독서기록</button>
      <button onclick="selectTag(this,'#인간관계')" class="tag-btn px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#888] text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#인간관계</button>
      <button onclick="selectTag(this,'#일상')" class="tag-btn px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#888] text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#일상</button>
    </div>
    <div class="px-6 py-3">
      <textarea id="write-content" rows="4"
        class="w-full resize-none text-[15px] leading-relaxed text-[#0E0E0E] placeholder:text-[#444] bg-transparent border-0 border-none focus:ring-0 focus:outline-none"
        placeholder="지금 어떤 생각이 드나요? 자유롭게 나눠보세요 ✨"
        maxlength="500"
        oninput="updateCharCount()"></textarea>
    </div>
    <!-- Image preview -->
    <div id="img-preview-wrap" class="hidden px-6 pb-3">
      <div class="relative inline-block">
        <img id="img-preview" src="" alt="" class="max-h-52 rounded-xl object-cover border border-[#D8D5CA]"/>
        <button onclick="removeImage()" class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/70 flex items-center justify-center text-white hover:bg-black transition-colors">
          <span class="material-symbols-outlined text-[14px]">close</span>
        </button>
      </div>
    </div>
    <input type="file" id="img-input" accept="image/*" class="hidden" onchange="handleImageSelect(this)"/>
    <div class="flex items-center justify-between px-6 py-3 border-t border-[#E5E2D7]">
      <div class="flex items-center gap-3">
        <button onclick="document.getElementById('img-input').click()" class="flex items-center gap-1.5 text-[#555] hover:text-[#C8E600] transition-colors">
          <span class="material-symbols-outlined text-[22px]">add_photo_alternate</span>
          <span class="text-[12px]">사진</span>
        </button>
        <span id="char-count" class="text-[12px] text-[#555] font-medium">0 / 500</span>
      </div>
      <button id="submit-btn" onclick="submitPost()" class="px-6 py-2.5 bg-[#C8E600] text-black rounded-xl font-bold text-sm hover:bg-[#A8C400] active:scale-95 transition-all">게시하기</button>
    </div>
  </div>
</div>

<main class="pt-20 px-4 max-w-2xl mx-auto">

  <!-- Title -->
  <div class="py-4">
    <h1 class="text-2xl font-extrabold text-[#0E0E0E]">커뮤니티 💬</h1>
    <p class="text-[#666] text-sm mt-1">LOGIN 멤버들과 자유롭게 나눠요</p>
  </div>

  <!-- Channel Tabs -->
  <section class="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-1">
    <button data-channel="public" onclick="switchChannel('public')"
      class="channel-btn active flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#F4F1E8] text-[#888] text-[13px] font-medium whitespace-nowrap border border-[#D8D5CA]">
      💬 전체
    </button>
    <button data-channel="manager" onclick="switchChannel('manager')"
      class="channel-btn flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#F4F1E8] text-[#888] text-[13px] font-medium whitespace-nowrap border border-[#D8D5CA] hover:border-[#444]">
      ✨ 매니저
    </button>
    <button data-channel="admin" onclick="switchChannel('admin')"
      class="channel-btn flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#F4F1E8] text-[#888] text-[13px] font-medium whitespace-nowrap border border-[#D8D5CA] hover:border-[#444]">
      🔒 관리자
    </button>
  </section>

  <!-- Write Bar -->
  <section class="mb-4">
    <div id="write-bar" onclick="openWriteModal()" class="p-4 rounded-2xl border border-[#E5E2D7] bg-[#FAFAF5] flex items-center gap-3 cursor-pointer hover:border-[#CCC9BE] transition-all">
      <div id="write-bar-avatar" class="w-10 h-10 rounded-full bg-[#F0EDE6] flex items-center justify-center flex-shrink-0 border border-[#D8D5CA]">
        <span class="material-symbols-outlined text-[#555] text-xl">person</span>
      </div>
      <p id="write-bar-hint" class="text-[#555] text-[14px] flex-1">지금 어떤 생각이 드나요? ✨</p>
      <span class="material-symbols-outlined text-[#C8E600] text-[20px]" style="font-variation-settings:'FILL' 1">edit_square</span>
    </div>
    <div id="login-banner" class="hidden mt-3 p-4 bg-[#1A2600] rounded-2xl border border-[#C8E600]/20 flex items-center gap-3">
      <span class="material-symbols-outlined text-[#C8E600] text-lg flex-shrink-0" style="font-variation-settings:'FILL' 1">info</span>
      <p class="text-[#777777] text-sm flex-1">로그인하면 커뮤니티에 글을 올릴 수 있어요.</p>
      <a href="마이페이지.html" class="text-[#C8E600] font-bold text-sm whitespace-nowrap">로그인 →</a>
    </div>
  </section>

  <!-- Category Filter -->
  <section class="flex gap-2 mb-4 overflow-x-auto hide-scrollbar">
    <button data-cat="all" onclick="switchCategory('all')"
      class="cat-btn active flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#888] text-[12px] font-bold whitespace-nowrap border border-[#D8D5CA]">
      전체
    </button>
    <button data-cat="notice" onclick="switchCategory('notice')"
      class="cat-btn flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#666] text-[12px] font-bold whitespace-nowrap border border-[#D8D5CA]">
      📢 공지
    </button>
    <button data-cat="growth" onclick="switchCategory('growth')"
      class="cat-btn flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#666] text-[12px] font-bold whitespace-nowrap border border-[#D8D5CA]">
      🌱 성장
    </button>
    <button data-cat="career" onclick="switchCategory('career')"
      class="cat-btn flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#666] text-[12px] font-bold whitespace-nowrap border border-[#D8D5CA]">
      💼 커리어
    </button>
    <button data-cat="relation" onclick="switchCategory('relation')"
      class="cat-btn flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#F4F1E8] text-[#666] text-[12px] font-bold whitespace-nowrap border border-[#D8D5CA]">
      💞 관계
    </button>
  </section>

  <!-- Post Count -->
  <div class="flex items-center justify-between mb-3">
    <span id="post-count-label" class="text-[12px] text-[#555] font-medium"></span>
  </div>

  <!-- Loading skeleton -->
  <div id="feed-loading" class="space-y-3">
    <div class="rounded-2xl border border-[#E5E2D7] bg-[#FAFAF5] p-4">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full skeleton flex-shrink-0"></div>
        <div class="flex-1"><div class="h-3 w-24 skeleton mb-2"></div><div class="h-3 w-16 skeleton"></div></div>
      </div>
      <div class="h-3 skeleton mb-2"></div><div class="h-3 w-3/4 skeleton"></div>
    </div>
    <div class="rounded-2xl border border-[#E5E2D7] bg-[#FAFAF5] p-4">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full skeleton flex-shrink-0"></div>
        <div class="flex-1"><div class="h-3 w-20 skeleton mb-2"></div><div class="h-3 w-14 skeleton"></div></div>
      </div>
      <div class="h-3 skeleton mb-2"></div><div class="h-3 w-1/2 skeleton"></div>
    </div>
    <div class="rounded-2xl border border-[#E5E2D7] bg-[#FAFAF5] p-4">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full skeleton flex-shrink-0"></div>
        <div class="flex-1"><div class="h-3 w-28 skeleton mb-2"></div><div class="h-3 w-16 skeleton"></div></div>
      </div>
      <div class="h-3 skeleton mb-2"></div><div class="h-3 w-2/3 skeleton"></div>
    </div>
  </div>

  <!-- Empty -->
  <div id="feed-empty" class="hidden text-center py-20">
    <div class="text-5xl mb-4">💬</div>
    <p class="text-[#555] font-semibold text-base">아직 글이 없어요</p>
    <p class="text-[#444] text-sm mt-1">첫 번째 글을 작성해보세요!</p>
  </div>

  <!-- Error -->

<script>
// ─── Supabase ───────────────────────────────────────────────
const SUPABASE_URL = 'https://hroyuxjqqlimwrrhdwnd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RihZu0hAorZDdbE7bddoPQ_qsFpc0C4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── State ───────────────────────────────────────────────────
let currentUser = null;
let currentProfile = null;
let currentAccessToken = null;
let currentChannel = 'public';
let currentCategory = 'all';
let allPosts = [];
let myLikedPostIds = new Set();
let selectedTag = null;
let isSubmitting = false;
let selectedImageFile = null;

// ─── Init ────────────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      currentUser = session.user;
      currentAccessToken = session.access_token || null;
      await loadProfile();
      updateHeaderAvatar();
      updateWriteBar();
    } else {
      updateWriteBar();
    }
    await loadFeed();
  } catch (e) {
    updateWriteBar();
    await loadFeed();
  }
}

// ─── Profile (direct fetch + JWT) ───────────────────────────
async function loadProfile() {
  if (!currentUser) return;
  try {
    const token = currentAccessToken || SUPABASE_ANON_KEY;
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 5000);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(currentUser.id)}&select=*&limit=1`,
      { signal: controller.signal, headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` } }
    );
    if (res.ok) {
      const rows = await res.json();
      if (rows && rows.length > 0) currentProfile = rows[0];
    }
  } catch (e) {}
}

function updateHeaderAvatar() {
  const el = document.getElementById('header-avatar');
  if (!el || !currentProfile?.name) return;
  el.innerHTML = `<span class="text-sm font-bold text-blue-700">${currentProfile.name.charAt(0).toUpperCase()}</span>`;
  el.classList.remove('bg-slate-200');
  el.classList.add('bg-blue-100');
}

function updateWriteBar() {
  const loginBanner = document.getElementById('login-banner');
  const avatar = document.getElementById('write-bar-avatar');
  if (currentUser && currentProfile) {
    loginBanner.classList.add('hidden');
    const initial = currentProfile.name ? currentProfile.name.charAt(0).toUpperCase() : '?';
    avatar.innerHTML = `<span class="text-white font-bold text-sm">${initial}</span>`;
    avatar.className = 'w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0';
  } else if (currentUser) {
    loginBanner.classList.add('hidden');
  } else {
    loginBanner.classList.remove('hidden');
  }
}

// ─── Channel switch ───────────────────────────────────────────
function switchChannel(channel) {
  if (channel === 'manager') {
    if (!currentUser) { showToast('로그인이 필요합니다', 'warning'); return; }
    const r = currentProfile?.role;
    if (r !== 'manager' && r !== 'admin') { showToast('매니저 이상 권한이 필요합니다', 'warning'); return; }
  }
  if (channel === 'admin') {
    if (!currentUser) { showToast('로그인이 필요합니다', 'warning'); return; }
    if (currentProfile?.role !== 'admin') { showToast('관리자만 접근할 수 있습니다', 'warning'); return; }
  }
  currentChannel = channel;
  document.querySelectorAll('.channel-btn').forEach(btn => {
    if (btn.dataset.channel === channel) {
      btn.classList.add('active');
      btn.classList.remove('bg-slate-100','text-slate-600','hover:bg-slate-200');
    } else {
      btn.classList.remove('active');
      btn.classList.add('bg-slate-100','text-slate-600','hover:bg-slate-200');
    }
  });
  loadFeed();
}

// ─── Category switch ─────────────────────────────────────────
function switchCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    if (btn.dataset.cat === cat) {
      btn.classList.add('active');
      btn.classList.remove('bg-slate-100','text-slate-500','hover:bg-slate-200');
      btn.classList.add('bg-slate-800','text-white');
    } else {
      btn.classList.remove('active','bg-slate-800','text-white');
      btn.classList.add('bg-slate-100','text-slate-500','hover:bg-slate-200');
    }
  });
  renderFiltered();
}

// ─── Load Feed ───────────────────────────────────────────────
async function loadFeed() {
  const feedEl    = document.getElementById('feed');
  const loadingEl = document.getElementById('feed-loading');
  const emptyEl   = document.getElementById('feed-empty');
  const errorEl   = document.getElementById('feed-error');

  feedEl.classList.add('hidden');
  loadingEl.classList.remove('hidden');
  emptyEl.classList.add('hidden');
  errorEl.classList.add('hidden');

  try {
    // Posts + profiles join
    const token = currentAccessToken || SUPABASE_ANON_KEY;
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 8000);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/posts?channel=eq.${currentChannel}&select=*,profiles(name,role)&order=created_at.desc`,
      { signal: controller.signal, headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } }
    );
    if (!res.ok) throw new Error('fetch failed');
    allPosts = await res.json();

    // My likes
    myLikedPostIds = new Set();
    if (currentUser) {
      try {
        const ctrl2 = new AbortController();
        setTimeout(() => ctrl2.abort(), 5000);
        const likesRes = await fetch(
          `${SUPABASE_URL}/rest/v1/likes?user_id=eq.${encodeURIComponent(currentUser.id)}&select=post_id`,
          { signal: ctrl2.signal, headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` } }
        );
        if (likesRes.ok) {
          const likes = await likesRes.json();
          likes.forEach(l => myLikedPostIds.add(l.post_id));
        }
      } catch (e) {}
    }

    loadingEl.classList.add('hidden');
    renderFiltered();

  } catch (e) {
    loadingEl.classList.add('hidden');
    errorEl.classList.remove('hidden');
  }
}

// ─── Render filtered list ─────────────────────────────────────
function renderFiltered() {
  const feedEl  = document.getElementById('feed');
  const emptyEl = document.getElementById('feed-empty');
  const countEl = document.getElementById('post-count-label');

  // Filter
  let filtered = allPosts;
  if (currentCategory === 'notice') {
    filtered = allPosts.filter(p => p.tag === '#공지');
  } else if (currentCategory === 'growth') {
    filtered = allPosts.filter(p => ['#마음성장','#감정','#일상','#독서기록'].includes(p.tag));
  } else if (currentCategory === 'career') {
    filtered = allPosts.filter(p => p.tag === '#커리어');
  } else if (currentCategory === 'relation') {
    filtered = allPosts.filter(p => ['#관계','#인간관계'].includes(p.tag));
  }

  // Sort: 공지 상단 고정 → 나머지 최신순
  filtered.sort((a, b) => {
    const aNotice = a.tag === '#공지' ? 1 : 0;
    const bNotice = b.tag === '#공지' ? 1 : 0;
    if (aNotice !== bNotice) return bNotice - aNotice;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  countEl.textContent = `총 ${filtered.length}개`;

  if (filtered.length === 0) {
    feedEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  feedEl.innerHTML = filtered.map((post, idx) => postRowHTML(post, idx, filtered.length)).join('');
  feedEl.classList.remove('hidden');
}

// ─── Post Card HTML (social feed) ────────────────────────────
function postRowHTML(post, idx, total) {
  const profile = post.profiles || {};
  const name    = profile.name || '알 수 없음';
  const role    = profile.role || 'member';
  const isLiked = myLikedPostIds.has(post.id);
  const timeStr = formatDate(post.created_at);
  const fullContent = escapeHtml(post.content || '').replace(/\n/g, '<br>');

  const tagStyles = {
    '#공지':    { color:'#f87171', bg:'rgba(248,113,113,0.12)', label:'📢 공지' },
    '#마음성장':{ color:'#34d399', bg:'rgba(52,211,153,0.12)',  label:'🌱 마음성장' },
    '#감정':    { color:'#a78bfa', bg:'rgba(167,139,250,0.12)', label:'💜 감정' },
    '#커리어':  { color:'#60a5fa', bg:'rgba(96,165,250,0.12)',  label:'💼 커리어' },
    '#관계':    { color:'#fb7185', bg:'rgba(251,113,133,0.12)', label:'💞 관계' },
    '#인간관계':{ color:'#fb7185', bg:'rgba(251,113,133,0.12)', label:'💞 인간관계' },
    '#독서기록':{ color:'#c084fc', bg:'rgba(192,132,252,0.12)', label:'📚 독서기록' },
    '#일상':    { color:'#fbbf24', bg:'rgba(251,191,36,0.12)',  label:'☀️ 일상' },
  };
  const ts = tagStyles[post.tag] || { color:'#888', bg:'rgba(136,136,136,0.1)', label:(post.tag||'').replace('#','') };

  const roleBadge = role === 'admin'
    ? `<span style="background:rgba(251,191,36,0.15);color:#fbbf24" class="px-1.5 py-0.5 rounded text-[10px] font-bold">관리자</span>`
    : role === 'manager'
    ? `<span style="background:rgba(197,255,0,0.12);color:#C5FF00" class="px-1.5 py-0.5 rounded text-[10px] font-bold">매니저</span>`
    : '';

  const avatarColors = ['#3b82f6','#8b5cf6','#10b981','#f43f5e','#f59e0b','#6366f1','#14b8a6'];
  const avatarColor  = avatarColors[name.charCodeAt(0) % avatarColors.length];

  return `
  <div class="post-card rounded-2xl border border-[#E5E2D7] bg-white p-4">
    <!-- Header -->
    <div class="flex items-start gap-3 mb-3">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0" style="background:${avatarColor}">
        ${name.charAt(0).toUpperCase()}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-bold text-[13px] text-[#0E0E0E]">${escapeHtml(name)}</span>
          ${roleBadge}
          <span class="text-[11px] text-[#444] ml-auto">${timeStr}</span>
        </div>
        <span class="inline-block mt-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold" style="background:${ts.bg};color:${ts.color}">${ts.label}</span>
      </div>
    </div>

    <!-- Content -->
    <div class="text-[14px] leading-relaxed text-[#2A2A2A] mb-3">${fullContent}</div>
    ${post.image_url ? `
    <div class="mb-3 rounded-xl overflow-hidden border border-[#E5E2D7]">
      <img src="${post.image_url}" alt="" class="w-full max-h-80 object-cover" loading="lazy" onerror="this.parentElement.remove()"/>
    </div>` : ''}

    <!-- Actions -->
    <div class="flex items-center gap-5 pt-3 border-t border-[#E5E2D7]">
      <button
        onclick="toggleLike('${post.id}', this)"
        class="like-btn flex items-center gap-1.5 transition-colors ${isLiked ? 'text-rose-400' : 'text-[#444] hover:text-rose-400'}"
        data-liked="${isLiked}" data-count="${post.likes_count || 0}"
      >
        <span class="material-symbols-outlined like-icon text-[18px]" style="font-variation-settings:'FILL' ${isLiked ? '1' : '0'},'wght' 400,'GRAD' 0,'opsz' 24">favorite</span>
        <span class="like-count text-[13px]">${post.likes_count || 0}</span>
      </button>
      <button onclick="toggleComments('${post.id}')" class="flex items-center gap-1.5 text-[#444] hover:text-[#888] transition-colors">
        <span class="material-symbols-outlined text-[18px]">chat_bubble</span>
        <span class="text-[13px]">댓글</span>
      </button>
      ${currentProfile?.role === 'admin' ? `
      <button onclick="deletePost('${post.id}')" class="ml-auto flex items-center gap-1 text-[#333] hover:text-red-400 transition-colors">
        <span class="material-symbols-outlined text-[16px]">delete</span>
      </button>` : ''}
    </div>

    <!-- Comment panel -->
    <div class="comment-panel" id="comments-${post.id}">
      <div class="mt-3 pt-3 border-t border-[#E5E2D7]">
        <div class="comment-list text-[13px] text-[#555] mb-3 space-y-2" id="comment-list-${post.id}">
          <p class="text-[#333] text-[12px]">첫 댓글을 달아보세요 💬</p>
        </div>
        ${currentUser ? `
        <div class="flex gap-2 mt-2">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-black font-bold text-[11px] flex-shrink-0" style="background:#C5FF00">
            ${currentProfile?.name ? currentProfile.name.charAt(0).toUpperCase() : '?'}
          </div>
          <div class="flex-1 flex gap-2">
            <input type="text" id="comment-input-${post.id}"
              class="flex-1 text-[13px] bg-[#F4F1E8] border border-[#D8D5CA] rounded-xl px-3 py-1.5 text-[#0E0E0E] placeholder:text-[#444] focus:outline-none focus:border-[#C8E600]/40"
              placeholder="댓글을 입력하세요..."
              onkeydown="if(event.key==='Enter') submitComment('${post.id}')"
            />
            <button onclick="submitComment('${post.id}')"
              class="px-3 py-1.5 bg-[#C8E600] text-black text-[12px] font-bold rounded-xl hover:bg-[#A8C400] transition-colors whitespace-nowrap">
              등록
            </button>
          </div>
        </div>` : `
        <p class="text-[12px] text-[#555]"><a href="마이페이지.html" class="text-[#C8E600] font-semibold">로그인</a>하면 댓글을 달 수 있어요.</p>
        `}
      </div>
    </div>
  </div>`;
}

// ─── Toggle Post ──────────────────────────────────────────────
function toggleComments(postId) {
  const panel = document.getElementById(`comments-${postId}`);
  if (!panel) return;
  panel.classList.toggle('open');
}

// ─── Admin Delete ──────────────────────────────────────────────
async function deletePost(postId) {
  if (currentProfile?.role !== 'admin') return;
  if (!confirm('이 글을 삭제하시겠어요?')) return;
  try {
    const token = currentAccessToken || SUPABASE_ANON_KEY;
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/posts?id=eq.${encodeURIComponent(postId)}`,
      {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${token}`,
          'Prefer': 'return=minimal'
        }
      }
    );
    if (!res.ok) throw new Error('failed');
    // 목록에서 제거
    allPosts = allPosts.filter(p => p.id !== postId);
    renderFiltered();
    showToast('글이 삭제됐습니다', 'success');
  } catch (e) {
    showToast('삭제에 실패했어요', 'error');
  }
}

// ─── Like ─────────────────────────────────────────────────────
async function toggleLike(postId, btnEl) {
  if (!currentUser) { showToast('로그인이 필요합니다', 'warning'); return; }
  const isLiked = btnEl.dataset.liked === 'true';
  const countEl = btnEl.querySelector('.like-count');
  const iconEl  = btnEl.querySelector('.like-icon');
  let count = parseInt(btnEl.dataset.count) || 0;

  // Optimistic UI
  const newLiked = !isLiked;
  count = newLiked ? count + 1 : Math.max(0, count - 1);
  btnEl.dataset.liked  = newLiked;
  btnEl.dataset.count  = count;
  countEl.textContent  = count;
  if (newLiked) {
    btnEl.classList.add('like-btn-active','text-rose-500');
    btnEl.classList.remove('text-slate-400','hover:text-rose-400');
    iconEl.style.fontVariationSettings = "'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24";
    myLikedPostIds.add(postId);
  } else {
    btnEl.classList.remove('like-btn-active','text-rose-500');
    btnEl.classList.add('text-slate-400','hover:text-rose-400');
    iconEl.style.fontVariationSettings = "'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24";
    myLikedPostIds.delete(postId);
  }

  try {
    if (isLiked) {
      await db.from('likes').delete().match({ post_id: postId, user_id: currentUser.id });
    } else {
      await db.from('likes').insert({ post_id: postId, user_id: currentUser.id });
    }
  } catch (e) {
    // Rollback
    const rollback = !newLiked;
    const rc = rollback ? count + 1 : Math.max(0, count - 1);
    btnEl.dataset.liked = rollback; btnEl.dataset.count = rc; countEl.textContent = rc;
    showToast('좋아요 처리 중 오류가 발생했습니다', 'error');
  }
}

// ─── Comment (in-memory, no DB table yet) ────────────────────
const localComments = {};

function submitComment(postId) {
  if (!currentUser) return;
  const input = document.getElementById(`comment-input-${postId}`);
  const text = input?.value.trim();
  if (!text) return;

  if (!localComments[postId]) localComments[postId] = [];
  const name = currentProfile?.name || '사용자';
  localComments[postId].push({ name, text, time: '방금 전' });

  const listEl = document.getElementById(`comment-list-${postId}`);
  if (listEl) {
    listEl.innerHTML = localComments[postId].map(c => `
      <div class="flex gap-2 mb-2">
        <div class="w-6 h-6 rounded-full bg-[#3b82f6] flex items-center justify-center text-white font-bold text-[10px] flex-shrink-0">${c.name.charAt(0)}</div>
        <div class="bg-[#F4F1E8] rounded-xl px-2.5 py-1.5 flex-1">
          <span class="font-semibold text-[12px] text-[#0E0E0E]">${escapeHtml(c.name)}</span>
          <span class="text-[11px] text-[#444] ml-1">${c.time}</span>
          <p class="text-[12px] text-[#777777] mt-0.5">${escapeHtml(c.text)}</p>
        </div>
      </div>
    `).join('');
  }
  if (input) input.value = '';
}

// ─── Write Modal ──────────────────────────────────────────────
function openWriteModal() {
  if (!currentUser) {
    showToast('로그인이 필요합니다', 'warning');
    setTimeout(() => { location.href = '마이페이지.html'; }, 1500);
    return;
  }
  const name = currentProfile?.name || '사용자';
  document.getElementById('modal-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('modal-username').textContent = name;
  const labels = { public:'전체 피드', manager:'매니저 라운지', admin:'관리자 채널' };
  document.getElementById('modal-channel-label').textContent = labels[currentChannel] || '전체 피드';
  document.getElementById('write-content').value = '';
  document.getElementById('char-count').textContent = '0 / 500';
  selectedTag = null;
  removeImage();
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('selected','bg-blue-50','text-blue-700','border-blue-200');
    b.classList.add('bg-slate-100','text-slate-600','border-transparent');
  });
  document.getElementById('write-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('write-content').focus(), 150);

  // 키보드가 올라올 때 모달을 키보드 위로 올림
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportResize);
    window.visualViewport.addEventListener('scroll', onViewportResize);
  }
}

const NAV_HEIGHT = 80;

function onViewportResize() {
  const modal = document.getElementById('write-modal');
  if (!modal) return;
  const vv = window.visualViewport;
  const keyboardHeight = window.innerHeight - vv.offsetTop - vv.height;
  // 키보드가 올라오면 nav 위 + 키보드 높이만큼, 키보드 없으면 nav 위에만
  modal.style.bottom = (Math.max(0, keyboardHeight) + (keyboardHeight > 10 ? 0 : NAV_HEIGHT)) + 'px';
}

function closeWriteModal() {
  document.getElementById('write-overlay').classList.add('hidden');
  document.body.style.overflow = '';
  const modal = document.getElementById('write-modal');
  if (modal) modal.style.bottom = NAV_HEIGHT + 'px';
  if (window.visualViewport) {
    window.visualViewport.removeEventListener('resize', onViewportResize);
    window.visualViewport.removeEventListener('scroll', onViewportResize);
  }
}

function selectTag(btn, tag) {
  selectedTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('selected','bg-blue-50','text-blue-700','border-blue-200');
    b.classList.add('bg-slate-100','text-slate-600','border-transparent');
  });
  btn.classList.add('selected','bg-blue-50','text-blue-700','border-blue-200');
  btn.classList.remove('bg-slate-100','text-slate-600','border-transparent');
}

function updateCharCount() {
  const n = document.getElementById('write-content').value.length;
  const el = document.getElementById('char-count');
  el.textContent = `${n} / 500`;
  el.classList.toggle('text-amber-500', n > 450);
  el.classList.toggle('text-slate-400', n <= 450);
}

function handleImageSelect(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { showToast('10MB 이하 이미지만 올릴 수 있어요', 'warning'); return; }
  selectedImageFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('img-preview').src = e.target.result;
    document.getElementById('img-preview-wrap').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  selectedImageFile = null;
  const input = document.getElementById('img-input');
  if (input) input.value = '';
  document.getElementById('img-preview-wrap')?.classList.add('hidden');
  document.getElementById('img-preview').src = '';
}

async function submitPost() {
  if (isSubmitting || !currentUser) return;
  const content = document.getElementById('write-content').value.trim();
  if (!content && !selectedImageFile) { showToast('내용을 입력해주세요', 'warning'); return; }

  isSubmitting = true;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '게시 중...';

  try {
    let image_url = null;
    if (selectedImageFile) {
      btn.textContent = '사진 업로드 중...';
      const ext = selectedImageFile.name.split('.').pop().toLowerCase();
      const path = `${currentUser.id}/${Date.now()}.${ext}`;
      const { data: uploadData, error: uploadError } = await db.storage
        .from('post-images')
        .upload(path, selectedImageFile, { contentType: selectedImageFile.type, upsert: false });
      if (uploadError) throw uploadError;
      const { data: urlData } = db.storage.from('post-images').getPublicUrl(path);
      image_url = urlData.publicUrl;
    }

    btn.textContent = '게시 중...';
    const { error } = await db.from('posts').insert({
      user_id: currentUser.id, content: content || '', tag: selectedTag, channel: currentChannel, image_url
    });
    if (error) throw error;
    closeWriteModal();
    showToast('글이 게시되었습니다!', 'success');
    await loadFeed();
  } catch (e) {
    showToast('게시에 실패했습니다', 'error');
  } finally {
    isSubmitting = false;
    btn.disabled = false; btn.textContent = '게시하기';
  }
}

// ─── Utils ────────────────────────────────────────────────────
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60)    return '방금 전';
  if (diff < 3600)  return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  if (diff < 604800) return `${Math.floor(diff/86400)}일 전`;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

let toastTimer = null;
function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  const inner = document.getElementById('toast-inner');
  const colors = { success:'bg-emerald-600', error:'bg-red-600', warning:'bg-amber-500', info:'bg-slate-700' };
  inner.className = `px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white max-w-[320px] text-center ${colors[type]||colors.info}`;
  inner.textContent = msg;
  toast.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.add('hidden'), 3000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeWriteModal();
  if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') {
    if (!document.getElementById('write-overlay').classList.contains('hidden')) submitPost();
  }
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
