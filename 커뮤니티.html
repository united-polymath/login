<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SELAB - 커뮤니티</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "on-surface": "#191c1e",
          "on-surface-variant": "#434655",
          "background": "#f7f9fb",
        }
      }
    }
  }
</script>
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { min-height: 100dvh; background: #f7f9fb; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  textarea:focus { outline: none; box-shadow: none; }

  /* Channel tab */
  .channel-btn.active { background: #004ac6; color: #fff; font-weight: 700; }
  .channel-btn { transition: all 0.15s; }

  /* Category filter */
  .cat-btn.active { background: #1e293b; color: #fff; }
  .cat-btn { transition: all 0.15s; }

  /* Accordion post row */
  .post-row { transition: background 0.15s; }
  .post-row:hover { background: #f1f5f9; }
  .post-body { display: none; }
  .post-body.open { display: block; }
  .chevron-icon { transition: transform 0.25s; }
  .chevron-icon.open { transform: rotate(180deg); }

  /* Animations */
  @keyframes fadeSlide { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .post-body.open { animation: fadeSlide 0.2s ease forwards; }

  /* Skeleton */
  .skeleton { background: linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:6px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Write modal */
  .modal-enter { animation: modalUp 0.25s ease-out forwards; }
  @keyframes modalUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  #write-overlay { backdrop-filter: blur(4px); }
  #write-modal {
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  .tag-btn.selected { background:#dbeafe; color:#1d4ed8; border-color:#93c5fd; }

  /* Like active */
  .like-btn-active .like-icon { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; color:#f43f5e; }

  /* Toast */
  @keyframes toastIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  #toast { animation: toastIn 0.25s ease forwards; }
</style>
</head>
<body class="bg-background text-on-surface pb-28">

<!-- Toast -->
<div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[100] hidden">

<!-- Write Modal -->
<div id="write-overlay" class="fixed inset-0 z-50 bg-black/40 hidden" onclick="closeWriteModal()">
  <div id="write-modal" class="fixed left-0 right-0 bg-white rounded-t-3xl max-w-2xl mx-auto modal-enter" style="bottom:80px" onclick="event.stopPropagation()">

      <button onclick="selectTag(this,'#독서기록')" class="tag-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#독서기록</button>

      <button onclick="selectTag(this,'#일상')" class="tag-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 text-[12px] font-bold whitespace-nowrap border-2 border-transparent">#일상</button>

<script>
// ─── Supabase ───────────────────────────────────────────────
const SUPABASE_URL = 'https://hroyuxjqqlimwrrhdwnd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RihZu0hAorZDdbE7bddoPQ_qsFpc0C4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── State ───────────────────────────────────────────────────
let currentUser = null;
let currentProfile = null;
let currentAccessToken = null;
let currentChannel = 'public';
let currentCategory = 'all';
let allPosts = [];
let myLikedPostIds = new Set();
let selectedTag = null;
let isSubmitting = false;

// ─── Init ────────────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      currentUser = session.user;
      currentAccessToken = session.access_token || null;
      await loadProfile();
      updateHeaderAvatar();
      updateWriteBar();
    } else {
      updateWriteBar();
    }
    await loadFeed();
  } catch (e) {
    updateWriteBar();
    await loadFeed();
  }
}

// ─── Profile (direct fetch + JWT) ───────────────────────────
async function loadProfile() {
  if (!currentUser) return;
  try {
    const token = currentAccessToken || SUPABASE_ANON_KEY;
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 5000);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(currentUser.id)}&select=*&limit=1`,
      { signal: controller.signal, headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` } }
    );
    if (res.ok) {
      const rows = await res.json();
      if (rows && rows.length > 0) currentProfile = rows[0];
    }
  } catch (e) {}
}

function updateHeaderAvatar() {
  const el = document.getElementById('header-avatar');
  if (!el || !currentProfile?.name) return;
  el.innerHTML = `<span class="text-sm font-bold text-blue-700">${currentProfile.name.charAt(0).toUpperCase()}</span>`;
  el.classList.remove('bg-slate-200');
  el.classList.add('bg-blue-100');
}

function updateWriteBar() {
  const loginBanner = document.getElementById('login-banner');
  const avatar = document.getElementById('write-bar-avatar');
  if (currentUser && currentProfile) {
    loginBanner.classList.add('hidden');
    const initial = currentProfile.name ? currentProfile.name.charAt(0).toUpperCase() : '?';
    avatar.innerHTML = `<span class="text-white font-bold text-sm">${initial}</span>`;
    avatar.className = 'w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0';
  } else if (currentUser) {
    loginBanner.classList.add('hidden');
  } else {
    loginBanner.classList.remove('hidden');
  }
}

// ─── Channel switch ───────────────────────────────────────────
function switchChannel(channel) {
  if (channel === 'manager') {
    if (!currentUser) { showToast('로그인이 필요합니다', 'warning'); return; }
    const r = currentProfile?.role;
    if (r !== 'manager' && r !== 'admin') { showToast('매니저 이상 권한이 필요합니다', 'warning'); return; }
  }
  if (channel === 'admin') {
    if (!currentUser) { showToast('로그인이 필요합니다', 'warning'); return; }
    if (currentProfile?.role !== 'admin') { showToast('관리자만 접근할 수 있습니다', 'warning'); return; }
  }
  currentChannel = channel;
  document.querySelectorAll('.channel-btn').forEach(btn => {
    if (btn.dataset.channel === channel) {
      btn.classList.add('active');
      btn.classList.remove('bg-slate-100','text-slate-600','hover:bg-slate-200');
    } else {
      btn.classList.remove('active');
      btn.classList.add('bg-slate-100','text-slate-600','hover:bg-slate-200');
    }
  });
  loadFeed();
}

// ─── Category switch ─────────────────────────────────────────
function switchCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    if (btn.dataset.cat === cat) {
      btn.classList.add('active');
      btn.classList.remove('bg-slate-100','text-slate-500','hover:bg-slate-200');
      btn.classList.add('bg-slate-800','text-white');
    } else {
      btn.classList.remove('active','bg-slate-800','text-white');
      btn.classList.add('bg-slate-100','text-slate-500','hover:bg-slate-200');
    }
  });
  renderFiltered();
}

// ─── Load Feed ───────────────────────────────────────────────
async function loadFeed() {
  const feedEl    = document.getElementById('feed');
  const loadingEl = document.getElementById('feed-loading');
  const emptyEl   = document.getElementById('feed-empty');
  const errorEl   = document.getElementById('feed-error');

  feedEl.classList.add('hidden');
  loadingEl.classList.remove('hidden');
  emptyEl.classList.add('hidden');
  errorEl.classList.add('hidden');

  try {
    // Posts + profiles join
    const token = currentAccessToken || SUPABASE_ANON_KEY;
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 8000);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/posts?channel=eq.${currentChannel}&select=*,profiles(name,role)&order=created_at.desc`,
      { signal: controller.signal, headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } }
    );
    if (!res.ok) throw new Error('fetch failed');
    allPosts = await res.json();

    // My likes
    myLikedPostIds = new Set();
    if (currentUser) {
      try {
        const ctrl2 = new AbortController();
        setTimeout(() => ctrl2.abort(), 5000);
        const likesRes = await fetch(
          `${SUPABASE_URL}/rest/v1/likes?user_id=eq.${encodeURIComponent(currentUser.id)}&select=post_id`,
          { signal: ctrl2.signal, headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` } }
        );
        if (likesRes.ok) {
          const likes = await likesRes.json();
          likes.forEach(l => myLikedPostIds.add(l.post_id));
        }
      } catch (e) {}
    }

    loadingEl.classList.add('hidden');
    renderFiltered();

  } catch (e) {
    loadingEl.classList.add('hidden');
    errorEl.classList.remove('hidden');
  }
}

// ─── Render filtered list ─────────────────────────────────────
function renderFiltered() {
  const feedEl  = document.getElementById('feed');
  const emptyEl = document.getElementById('feed-empty');
  const countEl = document.getElementById('post-count-label');

  // Filter
  let filtered = allPosts;
  if (currentCategory === 'notice') {
    filtered = allPosts.filter(p => p.tag === '#공지');
  } else if (currentCategory === 'growth') {
    filtered = allPosts.filter(p => ['#마음성장','#감정','#일상','#독서기록'].includes(p.tag));
  } else if (currentCategory === 'career') {
    filtered = allPosts.filter(p => p.tag === '#커리어');
  } else if (currentCategory === 'relation') {
    filtered = allPosts.filter(p => ['#관계','#인간관계'].includes(p.tag));
  }

  // Sort: 공지 상단 고정 → 나머지 최신순
  filtered.sort((a, b) => {
    const aNotice = a.tag === '#공지' ? 1 : 0;
    const bNotice = b.tag === '#공지' ? 1 : 0;
    if (aNotice !== bNotice) return bNotice - aNotice;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  countEl.textContent = `총 ${filtered.length}개`;

  if (filtered.length === 0) {
    feedEl.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  feedEl.innerHTML = filtered.map((post, idx) => postRowHTML(post, idx, filtered.length)).join('');
  feedEl.classList.remove('hidden');
}

// ─── Post Row HTML (accordion) ────────────────────────────────
function postRowHTML(post, idx, total) {
  const profile = post.profiles || {};
  const name    = profile.name || '알 수 없음';
  const role    = profile.role || 'member';
  const isLiked = myLikedPostIds.has(post.id);
  const lines   = (post.content || '').split('\n').filter(l => l.trim());
  const title   = lines[0] || '(내용 없음)';
  const hasbody = lines.length > 1 || (post.content || '').length > title.length;
  const timeStr = formatDate(post.created_at);

  // Tag styles
  const tagStyles = {
    '#공지':    { bg:'bg-red-100',     text:'text-red-700',     label:'공지' },
    '#마음성장':{ bg:'bg-emerald-100', text:'text-emerald-700', label:'마음성장' },
    '#감정':    { bg:'bg-purple-100',  text:'text-purple-700',  label:'감정' },
    '#커리어':  { bg:'bg-blue-100',    text:'text-blue-700',    label:'커리어' },
    '#관계':    { bg:'bg-rose-100',    text:'text-rose-700',    label:'관계' },
    '#인간관계':{ bg:'bg-rose-100',    text:'text-rose-700',    label:'인간관계' },
    '#독서기록':{ bg:'bg-violet-100',  text:'text-violet-700',  label:'독서기록' },
    '#일상':    { bg:'bg-amber-100',   text:'text-amber-700',   label:'일상' },
  };
  const ts = tagStyles[post.tag] || { bg:'bg-slate-100', text:'text-slate-500', label: (post.tag||'').replace('#','') };

  const roleBadge = role === 'admin'
    ? `<span class="px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded text-[10px] font-bold ml-1">관리자</span>`
    : role === 'manager'
    ? `<span class="px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded text-[10px] font-bold ml-1">매니저</span>`
    : '';

  const border = idx < total - 1 ? 'border-b border-slate-100' : '';

  const fullContent = escapeHtml(post.content || '').replace(/\n/g, '<br>');

  const avatarColors = ['bg-blue-500','bg-violet-500','bg-emerald-500','bg-rose-500','bg-amber-500','bg-indigo-500','bg-teal-500'];
  const avatarBg = avatarColors[name.charCodeAt(0) % avatarColors.length];

  return `
  <div class="${border}">
    <!-- Row (clickable title) -->
    <div class="post-row px-4 py-3.5 cursor-pointer select-none" onclick="togglePost('${post.id}')">
      <div class="flex items-start gap-3">
        <!-- Tag badge -->
        <span class="mt-0.5 flex-shrink-0 px-2 py-0.5 rounded-md text-[11px] font-bold ${ts.bg} ${ts.text} whitespace-nowrap">
          ${ts.label}
        </span>
        <!-- Title -->
        <span class="flex-1 text-[14px] font-semibold text-slate-800 leading-snug line-clamp-1">${escapeHtml(title)}</span>
        <!-- Meta -->
        <div class="flex items-center gap-2 flex-shrink-0 ml-1">
          <span class="text-[12px] text-slate-400 hidden sm:block">${escapeHtml(name)}${roleBadge}</span>
          <span class="text-[11px] text-slate-300">${timeStr}</span>
          <span class="flex items-center gap-0.5 text-[11px] text-slate-400">
            <span class="material-symbols-outlined text-[14px]">favorite</span>${post.likes_count || 0}
          </span>
          <span class="material-symbols-outlined text-[18px] text-slate-300 chevron-icon" id="chevron-${post.id}">expand_more</span>
        </div>
      </div>
    </div>

    <!-- Expanded body -->
    <div class="post-body" id="body-${post.id}">
      <div class="px-4 pb-4">
        <!-- Author info -->
        <div class="flex items-center gap-2.5 mb-3 pt-1">
          <div class="w-8 h-8 rounded-full ${avatarBg} flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
            ${name.charAt(0).toUpperCase()}
          </div>
          <div>
            <div class="flex items-center text-[13px] font-semibold text-slate-700">
              ${escapeHtml(name)}${roleBadge}
            </div>
            <div class="text-[11px] text-slate-400">${timeStr}</div>
          </div>
        </div>

        <!-- Full content -->
        <div class="text-[14px] leading-relaxed text-slate-700 mb-4 pl-0.5">${fullContent}</div>

        <!-- Like button + Admin delete -->
        <div class="flex items-center justify-between py-3 border-t border-slate-100 mb-4">
          <button
            onclick="event.stopPropagation(); toggleLike('${post.id}', this)"
            class="like-btn flex items-center gap-1.5 ${isLiked ? 'like-btn-active text-rose-500' : 'text-slate-400 hover:text-rose-400'} transition-colors"
            data-liked="${isLiked}" data-count="${post.likes_count || 0}"
          >
            <span class="material-symbols-outlined like-icon text-[18px]" style="font-variation-settings:'FILL' ${isLiked ? '1' : '0'},'wght' 400,'GRAD' 0,'opsz' 24">favorite</span>
            <span class="like-count text-[13px] font-medium">${post.likes_count || 0}</span>
          </button>
          ${currentProfile?.role === 'admin' ? `
          <button onclick="event.stopPropagation(); deletePost('${post.id}')"
            class="flex items-center gap-1 text-[12px] text-slate-300 hover:text-red-400 transition-colors">
            <span class="material-symbols-outlined text-[15px]">delete</span>
            <span>삭제</span>
          </button>` : ''}
        </div>

        <!-- Comment section -->
        <div class="bg-slate-50 rounded-xl p-3" id="comments-${post.id}">
          <p class="text-[12px] font-bold text-slate-500 mb-2">💬 댓글</p>
          <div class="comment-list text-[13px] text-slate-500 mb-3" id="comment-list-${post.id}">
            <p class="text-slate-300 text-[12px]">첫 댓글을 달아보세요</p>
          </div>
          ${currentUser ? `
          <div class="flex gap-2">
            <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-[11px] flex-shrink-0">
              ${currentProfile?.name ? currentProfile.name.charAt(0).toUpperCase() : '?'}
            </div>
            <div class="flex-1 flex gap-2">
              <input type="text" id="comment-input-${post.id}"
                class="flex-1 text-[13px] bg-white border border-slate-200 rounded-lg px-3 py-1.5 placeholder:text-slate-300 focus:outline-none focus:border-blue-400"
                placeholder="댓글을 입력하세요..."
                onkeydown="if(event.key==='Enter') submitComment('${post.id}')"
              />
              <button onclick="submitComment('${post.id}')"
                class="px-3 py-1.5 bg-blue-600 text-white text-[12px] font-bold rounded-lg hover:bg-blue-700 transition-colors whitespace-nowrap">
                등록
              </button>
            </div>
          </div>` : `
          <p class="text-[12px] text-slate-400"><a href="마이페이지.html" class="text-blue-500 font-semibold hover:underline">로그인</a>하면 댓글을 달 수 있어요.</p>
          `}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── Toggle Post ──────────────────────────────────────────────
function togglePost(postId) {
  const body    = document.getElementById(`body-${postId}`);
  const chevron = document.getElementById(`chevron-${postId}`);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);
}

// ─── Admin Delete ──────────────────────────────────────────────
async function deletePost(postId) {
  if (currentProfile?.role !== 'admin') return;
  if (!confirm('이 글을 삭제하시겠어요?')) return;
  try {
    const token = currentAccessToken || SUPABASE_ANON_KEY;
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/posts?id=eq.${encodeURIComponent(postId)}`,
      {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${token}`,
          'Prefer': 'return=minimal'
        }
      }
    );
    if (!res.ok) throw new Error('failed');
    // 목록에서 제거
    allPosts = allPosts.filter(p => p.id !== postId);
    renderFiltered();
    showToast('글이 삭제됐습니다', 'success');
  } catch (e) {
    showToast('삭제에 실패했어요', 'error');
  }
}

// ─── Like ─────────────────────────────────────────────────────
async function toggleLike(postId, btnEl) {
  if (!currentUser) { showToast('로그인이 필요합니다', 'warning'); return; }
  const isLiked = btnEl.dataset.liked === 'true';
  const countEl = btnEl.querySelector('.like-count');
  const iconEl  = btnEl.querySelector('.like-icon');
  let count = parseInt(btnEl.dataset.count) || 0;

  // Optimistic UI
  const newLiked = !isLiked;
  count = newLiked ? count + 1 : Math.max(0, count - 1);
  btnEl.dataset.liked  = newLiked;
  btnEl.dataset.count  = count;
  countEl.textContent  = count;
  if (newLiked) {
    btnEl.classList.add('like-btn-active','text-rose-500');
    btnEl.classList.remove('text-slate-400','hover:text-rose-400');
    iconEl.style.fontVariationSettings = "'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24";
    myLikedPostIds.add(postId);
  } else {
    btnEl.classList.remove('like-btn-active','text-rose-500');
    btnEl.classList.add('text-slate-400','hover:text-rose-400');
    iconEl.style.fontVariationSettings = "'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24";
    myLikedPostIds.delete(postId);
  }

  try {
    if (isLiked) {
      await db.from('likes').delete().match({ post_id: postId, user_id: currentUser.id });
    } else {
      await db.from('likes').insert({ post_id: postId, user_id: currentUser.id });
    }
  } catch (e) {
    // Rollback
    const rollback = !newLiked;
    const rc = rollback ? count + 1 : Math.max(0, count - 1);
    btnEl.dataset.liked = rollback; btnEl.dataset.count = rc; countEl.textContent = rc;
    showToast('좋아요 처리 중 오류가 발생했습니다', 'error');
  }
}

// ─── Comment (in-memory, no DB table yet) ────────────────────
const localComments = {};

function submitComment(postId) {
  if (!currentUser) return;
  const input = document.getElementById(`comment-input-${postId}`);
  const text = input?.value.trim();
  if (!text) return;

  if (!localComments[postId]) localComments[postId] = [];
  const name = currentProfile?.name || '사용자';
  localComments[postId].push({ name, text, time: '방금 전' });

  const listEl = document.getElementById(`comment-list-${postId}`);
  if (listEl) {
    listEl.innerHTML = localComments[postId].map(c => `
      <div class="flex gap-2 mb-2">
        <div class="w-6 h-6 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold text-[10px] flex-shrink-0">${c.name.charAt(0)}</div>
        <div class="bg-white rounded-lg px-2.5 py-1.5 flex-1">
          <span class="font-semibold text-[12px] text-slate-700">${escapeHtml(c.name)}</span>
          <span class="text-[11px] text-slate-400 ml-1">${c.time}</span>
          <p class="text-[12px] text-slate-600 mt-0.5">${escapeHtml(c.text)}</p>
        </div>
      </div>
    `).join('');
  }
  if (input) input.value = '';
}

// ─── Write Modal ──────────────────────────────────────────────
function openWriteModal() {
  if (!currentUser) {
    showToast('로그인이 필요합니다', 'warning');
    setTimeout(() => { location.href = '마이페이지.html'; }, 1500);
    return;
  }
  const name = currentProfile?.name || '사용자';
  document.getElementById('modal-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('modal-username').textContent = name;
  const labels = { public:'전체 피드', manager:'매니저 라운지', admin:'관리자 채널' };
  document.getElementById('modal-channel-label').textContent = labels[currentChannel] || '전체 피드';
  document.getElementById('write-content').value = '';
  document.getElementById('char-count').textContent = '0 / 500';
  selectedTag = null;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('selected','bg-blue-50','text-blue-700','border-blue-200');
    b.classList.add('bg-slate-100','text-slate-600','border-transparent');
  });
  document.getElementById('write-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('write-content').focus(), 150);

  // 키보드가 올라올 때 모달을 키보드 위로 올림
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportResize);
    window.visualViewport.addEventListener('scroll', onViewportResize);
  }
}

const NAV_HEIGHT = 80;

function onViewportResize() {
  const modal = document.getElementById('write-modal');
  if (!modal) return;
  const vv = window.visualViewport;
  const keyboardHeight = window.innerHeight - vv.offsetTop - vv.height;
  // 키보드가 올라오면 nav 위 + 키보드 높이만큼, 키보드 없으면 nav 위에만
  modal.style.bottom = (Math.max(0, keyboardHeight) + (keyboardHeight > 10 ? 0 : NAV_HEIGHT)) + 'px';
}

function closeWriteModal() {
  document.getElementById('write-overlay').classList.add('hidden');
  document.body.style.overflow = '';
  const modal = document.getElementById('write-modal');
  if (modal) modal.style.bottom = NAV_HEIGHT + 'px';
  if (window.visualViewport) {
    window.visualViewport.removeEventListener('resize', onViewportResize);
    window.visualViewport.removeEventListener('scroll', onViewportResize);
  }
}

function selectTag(btn, tag) {
  selectedTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.remove('selected','bg-blue-50','text-blue-700','border-blue-200');
    b.classList.add('bg-slate-100','text-slate-600','border-transparent');
  });
  btn.classList.add('selected','bg-blue-50','text-blue-700','border-blue-200');
  btn.classList.remove('bg-slate-100','text-slate-600','border-transparent');
}

function updateCharCount() {
  const n = document.getElementById('write-content').value.length;
  const el = document.getElementById('char-count');
  el.textContent = `${n} / 500`;
  el.classList.toggle('text-amber-500', n > 450);
  el.classList.toggle('text-slate-400', n <= 450);
}

async function submitPost() {
  if (isSubmitting || !currentUser) return;
  const content = document.getElementById('write-content').value.trim();
  if (!content) { showToast('내용을 입력해주세요', 'warning'); return; }

  isSubmitting = true;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '게시 중...';

  try {
    const { error } = await db.from('posts').insert({
      user_id: currentUser.id, content, tag: selectedTag, channel: currentChannel
    });
    if (error) throw error;
    closeWriteModal();
    showToast('글이 게시되었습니다!', 'success');
    await loadFeed();
  } catch (e) {
    showToast('글을 게시하지 못했습니다', 'error');
  } finally {
    isSubmitting = false;
    btn.disabled = false; btn.textContent = '게시하기';
  }
}

// ─── Utils ────────────────────────────────────────────────────
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60)    return '방금 전';
  if (diff < 3600)  return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  if (diff < 604800) return `${Math.floor(diff/86400)}일 전`;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

let toastTimer = null;
function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  const inner = document.getElementById('toast-inner');
  const colors = { success:'bg-emerald-600', error:'bg-red-600', warning:'bg-amber-500', info:'bg-slate-700' };
  inner.className = `px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white max-w-[320px] text-center ${colors[type]||colors.info}`;
  inner.textContent = msg;
  toast.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.add('hidden'), 3000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeWriteModal();
  if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') {
    if (!document.getElementById('write-overlay').classList.contains('hidden')) submitPost();
  }
});

document.addEventListener('DOMContentLoaded', init);
</script>
